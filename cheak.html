<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd"><html><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><title>浏览器信息查询工具</title><style type="text/css">body{font-family:"Microsoft YaHei",Arial,sans-serif;padding:20px;}h1{color:#333;font-size:24px;}.section{margin-bottom:20px;border:1px solid #ddd;padding:15px;background:#f9f9f9;}.section h2{margin-top:0;color:#555;font-size:16px;}.section p{margin:5px 0;font-size:14px;word-break:break-all;}.section .label{font-weight:bold;}button{padding:8px 16px;margin-right:10px;cursor:pointer;}.info-row{margin:3px 0;}</style></head><body><h1>浏览器信息查询工具</h1><div class="section"><h2>基本信息</h2><div id="basic-info"><p>正在加载...</p></div></div><div class="section"><h2>功能支持</h2><div id="feature-support"><p>正在检测...</p></div></div><div class="section"><h2>屏幕信息</h2><div id="screen-info"><p>正在获取...</p></div></div><div class="section"><h2>其他信息</h2><div id="other-info"><p>正在收集...</p></div></div><div><button onclick="refreshInfo()">刷新信息</button><button onclick="copyToClipboard()">复制所有信息</button></div><script type="text/javascript">function getElementText(el){if(!el)return"";if(el.innerText!==undefined)return el.innerText;return el.textContent||"";}function setElementHTML(id,html){var el=document.getElementById(id);if(el)el.innerHTML=html;}function getBrowserInfo(){var ua=navigator.userAgent;var name="未知浏览器";var version="未知版本";if(ua.indexOf("Firefox")!==-1){name="Firefox";var m=ua.match(/Firefox\/([0-9.]+)/);if(m)version=m[1];}else if(ua.indexOf("Chrome")!==-1&&ua.indexOf("Edg")===-1){name="Chrome";var m=ua.match(/Chrome\/([0-9.]+)/);if(m)version=m[1];}else if(ua.indexOf("Safari")!==-1&&ua.indexOf("Chrome")===-1){name="Safari";var m=ua.match(/Version\/([0-9.]+)/);if(m)version=m[1];}else if(ua.indexOf("Edg")!==-1){name="Microsoft Edge";var m=ua.match(/Edg\/([0-9.]+)/);if(m)version=m[1];}else if(ua.indexOf("Opera")!==-1||ua.indexOf("OPR")!==-1){name="Opera";var m=ua.match(/(Opera|OPR)\/([0-9.]+)/);if(m)version=m[2];}else if(ua.indexOf("MSIE")!==-1||ua.indexOf("Trident")!==-1){name="Internet Explorer";var m=ua.match(/(MSIE |rv:)([0-9.]+)/);if(m)version=m[2];}var vendor="未知";try{if(navigator.vendor)vendor=navigator.vendor;}catch(e){}var product="未知";try{if(navigator.product)product=navigator.product;}catch(e){}var platform="未知";try{if(navigator.platform)platform=navigator.platform;}catch(e){}return{name:name,version:version,userAgent:ua,platform:platform,vendor:vendor,product:product};}function getFeatureSupport(){var features={cookies:"不支持",javascript:"支持",java:"不支持",localstorage:"不支持",sessionstorage:"不支持",geolocation:"不支持",serviceWorker:"不支持",webgl:"不支持",pdfViewer:"不支持",touch:"不支持"};try{if(navigator.cookieEnabled!==undefined)features.cookies=navigator.cookieEnabled?"支持":"不支持";}catch(e){}try{if(navigator.javaEnabled)features.java=navigator.javaEnabled()?"支持":"不支持";}catch(e){}try{if(window.localStorage!==undefined){var key="_test_";window.localStorage.setItem(key,"1");window.localStorage.removeItem(key);features.localstorage="支持";}}catch(e){}try{if(window.sessionStorage!==undefined){var key="_test_";window.sessionStorage.setItem(key,"1");window.sessionStorage.removeItem(key);features.sessionstorage="支持";}}catch(e){}try{if(navigator.geolocation!==undefined&&navigator.geolocation!==null)features.geolocation="支持";}catch(e){}try{if(navigator.serviceWorker!==undefined&&navigator.serviceWorker!==null)features.serviceWorker="支持";}catch(e){}try{var canvas=document.createElement("canvas");var gl=canvas.getContext("webgl")||canvas.getContext("experimental-webgl");if(gl&&gl.getParameter)features.webgl="支持";}catch(e){}try{if(navigator.pdfViewerEnabled!==undefined)features.pdfViewer=navigator.pdfViewerEnabled?"支持":"不支持";}catch(e){}try{if(window.ontouchstart!==undefined||(navigator.maxTouchPoints!==undefined&&navigator.maxTouchPoints>0))features.touch="支持";}catch(e){}return features;}function getScreenInfo(){var info={width:"未知",height:"未知",availWidth:"未知",availHeight:"未知",colorDepth:"未知",pixelDepth:"未知",orientation:"未知"};try{if(screen!==undefined){if(screen.width!==undefined)info.width=screen.width+"px";if(screen.height!==undefined)info.height=screen.height+"px";if(screen.availWidth!==undefined)info.availWidth=screen.availWidth+"px";if(screen.availHeight!==undefined)info.availHeight=screen.availHeight+"px";if(screen.colorDepth!==undefined)info.colorDepth=screen.colorDepth+"位";if(screen.pixelDepth!==undefined)info.pixelDepth=screen.pixelDepth+"位";}}catch(e){}try{if(screen.orientation!==undefined&&screen.orientation!==null)info.orientation=screen.orientation.type||"未知";}catch(e){}return info;}function getOtherInfo(){var info={language:"未知",languages:"未知",timezone:"未知",online:"未知",doNotTrack:"未设置",hardwareConcurrency:"未知",deviceMemory:"未知",maxTouchPoints:"未知"};try{info.language=navigator.language||navigator.userLanguage||"未知";}catch(e){}try{if(navigator.languages!==undefined&&navigator.languages!==null)info.languages=navigator.languages.join(", ");else info.languages=info.language;}catch(e){info.languages=info.language;}try{if(Intl!==undefined&&Intl.DateTimeFormat){var tz=Intl.DateTimeFormat().resolvedOptions().timeZone;if(tz)info.timezone=tz;}}catch(e){}try{if(navigator.onLine!==undefined)info.online=navigator.onLine?"在线":"离线";}catch(e){}try{if(navigator.doNotTrack!==undefined&&navigator.doNotTrack!==null)info.doNotTrack=navigator.doNotTrack;}catch(e){}try{if(navigator.hardwareConcurrency!==undefined&&navigator.hardwareConcurrency!==null)info.hardwareConcurrency=navigator.hardwareConcurrency+"核";}catch(e){}try{if(navigator.deviceMemory!==undefined&&navigator.deviceMemory!==null)info.deviceMemory=navigator.deviceMemory+"GB";}catch(e){}try{if(navigator.maxTouchPoints!==undefined&&navigator.maxTouchPoints!==null)info.maxTouchPoints=navigator.maxTouchPoints+"点";}catch(e){}return info;}function getPluginInfo(){var plugins=[];try{if(navigator.plugins&&navigator.plugins.length>0){for(var i=0;i<navigator.plugins.length;i++){if(navigator.plugins[i]&&navigator.plugins[i].name)plugins.push(navigator.plugins[i].name);}}}catch(e){return"无法检测";}return plugins.length>0?plugins.join(", "):"无插件";}function updateDisplay(){var browserInfo=getBrowserInfo();var features=getFeatureSupport();var screenInfo=getScreenInfo();var otherInfo=getOtherInfo();var plugins=getPluginInfo();var basicHTML='<p class="info-row"><span class="label">浏览器名称:</span> '+browserInfo.name+'</p><p class="info-row"><span class="label">浏览器版本:</span> '+browserInfo.version+'</p><p class="info-row"><span class="label">用户代理:</span> '+browserInfo.userAgent+'</p><p class="info-row"><span class="label">平台:</span> '+browserInfo.platform+'</p><p class="info-row"><span class="label">供应商:</span> '+browserInfo.vendor+'</p><p class="info-row"><span class="label">产品:</span> '+browserInfo.product+'</p><p class="info-row"><span class="label">插件列表:</span> '+plugins+'</p>';setElementHTML("basic-info",basicHTML);var featureHTML='<p class="info-row"><span class="label">Cookie 支持:</span> '+features.cookies+'</p><p class="info-row"><span class="label">JavaScript 支持:</span> '+features.javascript+'</p><p class="info-row"><span class="label">Java 支持:</span> '+features.java+'</p><p class="info-row"><span class="label">本地存储:</span> '+features.localstorage+'</p><p class="info-row"><span class="label">会话存储:</span> '+features.sessionstorage+'</p><p class="info-row"><span class="label">地理位置:</span> '+features.geolocation+'</p><p class="info-row"><span class="label">Service Worker:</span> '+features.serviceWorker+'</p><p class="info-row"><span class="label">WebGL:</span> '+features.webgl+'</p><p class="info-row"><span class="label">PDF 查看器:</span> '+features.pdfViewer+'</p><p class="info-row"><span class="label">触摸支持:</span> '+features.touch+'</p>';setElementHTML("feature-support",featureHTML);var screenHTML='<p class="info-row"><span class="label">屏幕宽度:</span> '+screenInfo.width+'</p><p class="info-row"><span class="label">屏幕高度:</span> '+screenInfo.height+'</p><p class="info-row"><span class="label">可用宽度:</span> '+screenInfo.availWidth+'</p><p class="info-row"><span class="label">可用高度:</span> '+screenInfo.availHeight+'</p><p class="info-row"><span class="label">颜色深度:</span> '+screenInfo.colorDepth+'</p><p class="info-row"><span class="label">像素深度:</span> '+screenInfo.pixelDepth+'</p><p class="info-row"><span class="label">屏幕方向:</span> '+screenInfo.orientation+'</p>';setElementHTML("screen-info",screenHTML);var otherHTML='<p class="info-row"><span class="label">首选语言:</span> '+otherInfo.language+'</p><p class="info-row"><span class="label">支持的语言:</span> '+otherInfo.languages+'</p><p class="info-row"><span class="label">时区:</span> '+otherInfo.timezone+'</p><p class="info-row"><span class="label">网络状态:</span> '+otherInfo.online+'</p><p class="info-row"><span class="label">不跟踪设置:</span> '+otherInfo.doNotTrack+'</p><p class="info-row"><span class="label">CPU核心数:</span> '+otherInfo.hardwareConcurrency+'</p><p class="info-row"><span class="label">设备内存:</span> '+otherInfo.deviceMemory+'</p><p class="info-row"><span class="label">最大触摸点数:</span> '+otherInfo.maxTouchPoints+'</p>';setElementHTML("other-info",otherHTML);}function refreshInfo(){updateDisplay();}function copyToClipboard(){var basicEl=document.getElementById("basic-info");var featureEl=document.getElementById("feature-support");var screenEl=document.getElementById("screen-info");var otherEl=document.getElementById("other-info");var basicText=getElementText(basicEl);var featureText=getElementText(featureEl);var screenText=getElementText(screenEl);var otherText=getElementText(otherEl);var allInfo="浏览器信息查询结果:\n\n基本信息:\n"+basicText+"\n\n功能支持:\n"+featureText+"\n\n屏幕信息:\n"+screenText+"\n\n其他信息:\n"+otherText;if(window.clipboardData){try{window.clipboardData.setData("Text",allInfo);alert("浏览器信息已复制到剪贴板！");return;}catch(e){}}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(allInfo).then(function(){alert("浏览器信息已复制到剪贴板！");})["catch"](function(){fallbackCopy(allInfo);});}else{fallbackCopy(allInfo);}}function fallbackCopy(text){var textarea=document.createElement("textarea");textarea.value=text;textarea.style.position="fixed";textarea.style.left="-9999px";textarea.style.top="0";textarea.style.width="1px";textarea.style.height="1px";document.body.appendChild(textarea);textarea.focus();textarea.select();try{if(document.execCommand("copy")){alert("浏览器信息已复制到剪贴板！");}else{alert("复制失败，请手动选择并复制文本。");}}catch(e){alert("复制失败，请手动选择并复制文本。");}document.body.removeChild(textarea);}function init(){updateDisplay();}if(window.addEventListener){window.addEventListener("load",init,false);}else if(window.attachEvent){window.attachEvent("onload",init);}else{window.onload=init;}</script></body></html>
