<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乐子牌收音机 · 动画演示</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #1e2b3c 0%, #0f1a26 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 16px;
            margin: 0;
        }

        /* 整个场景卡片容器 */
        .scene {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            border-radius: 52px;
            padding: 24px;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 3px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s;
        }

        /* 舞台：用于切换显示的页面 */
        .stage {
            background: #fbf3e0;
            border-radius: 36px;
            padding: 28px 20px 32px;
            box-shadow: inset 0 8px 12px rgba(0, 0, 0, 0.05), 0 10px 20px -5px rgba(0, 0, 0, 0.5);
            min-height: 560px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        /* 每个“页面”默认隐藏 */
        .page {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: fadeIn 0.45s ease;
        }

        .page.active {
            display: flex;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ---------- 页面1: 哭脸 + 爸爸我要买这个 ---------- */
        .cry-emoji {
            font-size: 9rem;
            line-height: 1.2;
            filter: drop-shadow(0 10px 6px rgba(0, 0, 0, 0.15));
            animation: sob 1.8s infinite ease-in-out;
            margin-bottom: 16px;
            transform-origin: center 70%;
        }

        @keyframes sob {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.02) rotate(-3deg); }
            75% { transform: scale(0.98) rotate(3deg); }
        }

        .cry-text {
            font-size: 2.2rem;
            font-weight: 800;
            color: #3e2c1b;
            background: #fff7e8;
            padding: 16px 32px;
            border-radius: 100px;
            box-shadow: 0 6px 0 #bba88b, 0 12px 18px -8px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
            border: 2px solid #dbbc87;
            margin-top: 20px;
            transform: rotate(-1deg);
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.7);
            animation: gentlePulse 1.5s infinite alternate;
        }

        @keyframes gentlePulse {
            from { box-shadow: 0 6px 0 #bba88b, 0 12px 18px -8px rgba(0, 0, 0, 0.3); }
            to { box-shadow: 0 6px 0 #bba88b, 0 16px 26px -6px #c79b5e; }
        }

        /* ---------- 页面2: 售卖卡片 ---------- */
        .product-card {
            background: #fffcf0;
            border-radius: 44px;
            padding: 30px 32px 40px;
            width: 100%;
            max-width: 400px;
            border: 4px solid #e6d5b8;
            box-shadow: 0 16px 0 #9e8a6f, 0 28px 35px -10px #0e0e0e;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
            margin-bottom: 8px;
        }

        .cash-register {
            font-size: 5rem;
            filter: drop-shadow(0 8px 4px rgba(0, 0, 0, 0.15));
            margin-bottom: 8px;
            transition: transform 0.2s;
        }

        .brand {
            font-size: 2rem;
            font-weight: 900;
            color: #3b2b1a;
            background: #e7d7bd;
            padding: 8px 24px;
            border-radius: 60px;
            letter-spacing: 4px;
            border: 2px solid #b59d7a;
            box-shadow: inset 0 -3px 0 #9e8a6f;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        .price-tag {
            font-size: 3.8rem;
            font-weight: 800;
            color: #b44c2c;
            background: #f8e5c4;
            padding: 4px 28px;
            border-radius: 40px;
            border: 3px dashed #b9814b;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 6px 0 #7e5f40;
        }

        .price-tag span {
            font-size: 2.2rem;
            color: #6b4d2c;
            font-weight: 600;
            margin-right: 6px;
        }

        .buy-btn {
            background: #3db86b;
            border: none;
            border-radius: 100px;
            padding: 20px 60px;
            font-size: 2rem;
            font-weight: bold;
            color: #fff9e6;
            cursor: pointer;
            box-shadow: 0 10px 0 #1e6b3b, 0 14px 20px -6px #0000004d;
            transition: all 0.07s ease;
            letter-spacing: 2px;
            border: 2px solid #8fdaa8;
            text-shadow: 0 2px 0 #1e4b2b;
            transform: translateY(-2px);
        }

        .buy-btn:active {
            box-shadow: 0 4px 0 #1e6b3b;
            transform: translateY(6px);
            background: #2fa15a;
        }

        /* ---------- 页面3: 解锁无限时长 + 唱歌 + 着火 + 砸公司 ---------- */
        .unlock-area {
            text-align: center;
            width: 100%;
            max-width: 480px;
            margin-bottom: 20px;
        }

        .unlock-title {
            font-size: 2rem;
            font-weight: 800;
            color: #2e2b1f;
            background: #ffe9b6;
            padding: 14px 20px;
            border-radius: 60px;
            display: inline-block;
            border: 4px solid #af8e5c;
            box-shadow: 0 6px 0 #7d623f;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .unlock-btn {
            background: #f7b731;
            border: none;
            border-radius: 50px;
            padding: 16px 48px;
            font-size: 2rem;
            font-weight: bold;
            color: #2c1d0e;
            box-shadow: 0 10px 0 #b57c1a, 0 12px 18px -6px black;
            cursor: pointer;
            transition: 0.07s;
            border: 2px solid #ffe69b;
            text-shadow: 0 1px 0 white;
            margin-bottom: 26px;
            letter-spacing: 2px;
        }

        .unlock-btn:active {
            box-shadow: 0 4px 0 #b57c1a;
            transform: translateY(6px);
            background: #e6a420;
        }

        .singer-box {
            background: #d9c8ae;
            border-radius: 160px 160px 40px 40px;
            padding: 32px 16px 24px;
            margin: 18px 0 12px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 6px solid #b3956b;
            box-shadow: inset 0 -10px 0 #b3956b, 0 16px 18px -8px black;
            transition: background 0.3s, border-color 0.3s;
            position: relative;
        }

        .singer-emoji {
            font-size: 6rem;
            line-height: 1;
            transition: transform 0.2s;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.2));
        }

        .song-lyric {
            font-size: 1.8rem;
            font-weight: 700;
            color: #3b2a14;
            background: #fef6e6;
            padding: 12px 20px;
            border-radius: 40px;
            margin-top: 12px;
            border: 2px solid #9e8a6f;
            max-width: 100%;
            text-align: center;
            transition: all 0.2s;
            min-height: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }

        /* 着火状态 */
        .singer-box.on-fire {
            background: #ffa55c;
            border-color: #d1451e;
            box-shadow: inset 0 -10px 0 #b33d1a, 0 0 40px 10px #ff7b2e, 0 16px 18px -8px black;
            animation: flicker 0.2s infinite alternate;
        }

        .singer-box.on-fire .singer-emoji {
            filter: drop-shadow(0 0 18px #ff3c00) brightness(1.6);
            animation: shake 0.1s infinite;
        }

        @keyframes flicker {
            0% { background: #ffb86b; box-shadow: inset 0 -10px 0 #b33d1a, 0 0 30px 8px #ff7b2e, 0 16px 18px -8px black; }
            100% { background: #ff7f2a; box-shadow: inset 0 -10px 0 #9c2e0e, 0 0 55px 18px #ff4d00, 0 16px 18px -8px black; }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-1px, -1px) rotate(-2deg); }
            50% { transform: translate(2px, 0px) rotate(2deg); }
            75% { transform: translate(-2px, 1px) rotate(-1deg); }
            100% { transform: translate(1px, -1px) rotate(0deg); }
        }

        /* 砸公司区域 */
        .smash-zone {
            margin-top: 20px;
            padding: 12px 18px;
            border-radius: 100px;
            background: #2d1f12;
            color: #f5d9b0;
            font-size: 1.6rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            border: 3px solid #c9a87c;
            box-shadow: 0 8px 0 #120c07;
            transition: all 0.3s;
            width: 100%;
            letter-spacing: 1px;
        }

        .smash-zone.smashing {
            background: #4f2f1a;
            box-shadow: 0 0 30px #e0742e, 0 8px 0 #120c07;
            transform: scale(1.02);
            animation: smashShake 0.12s infinite;
        }

        @keyframes smashShake {
            0% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-8px) rotate(-1deg); }
            75% { transform: translateX(8px) rotate(1deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }

        .company-icon {
            font-size: 2.8rem;
            transition: transform 0.1s;
        }

        .smash-zone.smashing .company-icon {
            animation: crack 0.15s infinite;
        }

        @keyframes crack {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(15deg) scale(1.3); }
            100% { transform: rotate(-10deg) scale(0.9); }
        }

        /* 辅助隐藏 */
        .hidden {
            display: none !important;
        }

        .spacer {
            height: 10px;
        }
    </style>
</head>
<body>
<div class="scene">
    <div class="stage">

        <!-- 页面1：哭脸 + 爸爸我要买这个 -->
        <div id="page1" class="page active">
            <div class="cry-emoji">😭</div>
            <div class="cry-text">爸爸我要买这个</div>
        </div>

        <!-- 页面2：乐子牌收音机售卖卡片 -->
        <div id="page2" class="page">
            <div class="product-card">
                <div class="cash-register">🧾💰</div>
                <div class="brand">乐子牌收音机</div>
                <div class="price-tag"><span>¥</span>199</div>
                <button class="buy-btn" id="buyBtn">购买</button>
            </div>
        </div>

        <!-- 页面3：解锁无限时长 + 唱歌 + 起火 + 砸公司 -->
        <div id="page3" class="page">
            <!-- 解锁区域 -->
            <div id="unlockArea" class="unlock-area">
                <div class="unlock-title">🔓 解锁无限时长</div>
                <button class="unlock-btn" id="unlockBtn">解锁</button>
            </div>

            <!-- 唱歌/着火区域（一开始隐藏） -->
            <div id="singerArea" class="hidden" style="width:100%; display: flex; flex-direction: column; align-items: center;">
                <div id="singerBox" class="singer-box">
                    <div class="singer-emoji" id="singerEmoji">🎤🧑‍🎤</div>
                    <div class="song-lyric" id="songLyric">♪ 啦啦啦 ♪</div>
                </div>

                <!-- 砸公司区域 (初始隐藏，起火后出现) -->
                <div id="smashZone" class="smash-zone hidden">
                    <span class="company-icon">🏢</span>
                    <span>💥 砸了乐子公司 💥</span>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    (function() {
        // 页面元素
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const page3 = document.getElementById('page3');
        const buyBtn = document.getElementById('buyBtn');
        const unlockBtn = document.getElementById('unlockBtn');
        const unlockArea = document.getElementById('unlockArea');
        const singerArea = document.getElementById('singerArea');
        const singerBox = document.getElementById('singerBox');
        const songLyric = document.getElementById('songLyric');
        const smashZone = document.getElementById('smashZone');

        // 状态变量
        let singInterval = null;          // 唱歌歌词切换计时器
        let fireTimer = null;            // 起火计时器 (15秒后)
        let smashTimer = null;           // 砸公司计时器 (起火后触发)
        let currentLyricIndex = 0;       // 当前歌词索引
        let isBurning = false;           // 是否已经起火
        let isSmashing = false;          // 是否已经开始砸

        // 歌词列表
        const lyrics = [
            "♪ 乐子牌收音机，无限唱不停 ♪",
            "♪ 爸爸我要买，买了就开心 ♪",
            "♪ 音质真不错，就是有点烫 ♪",
            "♪ 烧起来了！还唱！ ♪",
            "♪ 噢噢噢 起火啦 还在唱 ♪",
            "♪ 乐子公司 我谢谢你 ♪",
            "♪ 我现在就去砸你公司 ♪",
            "♪ 无限时长？无限火灾！ ♪",
        ];

        // 切换页面函数
        function showPage(pageId) {
            page1.classList.remove('active');
            page2.classList.remove('active');
            page3.classList.remove('active');
            document.getElementById(pageId).classList.add('active');
        }

        // 重置所有状态 (防止多次点击累积)
        function resetAll() {
            // 清除所有计时器
            if (singInterval) clearInterval(singInterval);
            if (fireTimer) clearTimeout(fireTimer);
            if (smashTimer) clearTimeout(smashTimer);
            singInterval = null;
            fireTimer = null;
            smashTimer = null;

            // 重置UI
            singerBox.classList.remove('on-fire');
            smashZone.classList.remove('smashing');
            smashZone.classList.add('hidden');
            singerArea.classList.add('hidden');
            unlockArea.classList.remove('hidden');
            songLyric.textContent = "♪ 啦啦啦 ♪";
            currentLyricIndex = 0;
            isBurning = false;
            isSmashing = false;

            // 重置歌手emoji (正常)
            document.getElementById('singerEmoji').textContent = '🎤🧑‍🎤';
        }

        // 开始唱歌 (无限循环歌词)
        function startSinging() {
            if (singInterval) clearInterval(singInterval);
            // 立即显示第一句 (歌词索引从0开始，但我们需要让它变化)
            // 确保歌词轮换
            currentLyricIndex = 0;
            songLyric.textContent = lyrics[0];

            singInterval = setInterval(() => {
                currentLyricIndex = (currentLyricIndex + 1) % lyrics.length;
                songLyric.textContent = lyrics[currentLyricIndex];
                // 如果已经起火并且歌词到后面时增加一点小摇晃？不需要，靠fire样式
            }, 1200); // 1.2秒换一句
        }

        // 点火 (起火特效并改变表情)
        function igniteFire() {
            if (isBurning) return;
            isBurning = true;
            // 添加着火类
            singerBox.classList.add('on-fire');
            // 改变唱歌表情为火+唱歌 (保留唱歌但火大)
            document.getElementById('singerEmoji').textContent = '🔥🎤🔥';
            // 强制修改一句歌词提示
            songLyric.textContent = "🔥 着火了！但还在唱！🔥";

            // 约1.8秒后继续歌词轮换 (不加额外操作，因为singInterval已经在跑)
            // 但可能会被立即覆盖，所以调整一下，继续轮换也无妨
            // 为了突出起火，可以临时暂停一下歌词重置？不管了，继续轮换更有趣

            // 起火后1.2秒出现砸公司按钮/区域
            if (smashTimer) clearTimeout(smashTimer);
            smashTimer = setTimeout(() => {
                if (!isSmashing) {
                    isSmashing = true;
                    smashZone.classList.remove('hidden');
                    // 添加砸的动画类
                    smashZone.classList.add('smashing');
                    // 同时调整一下歌手的模样? (可选)
                    // 在砸公司期间，歌词继续魔性
                    // 把歌词强制定格在某些内容？不需要，但让它更混乱一点
                    // 如果希望歌词更疯，可以临时覆盖：但我们的singInterval还在跑，就这样吧
                }
            }, 1200); // 起火后1.2秒开始砸公司
        }

        // 解锁按钮点击处理
        function onUnlock() {
            // 隐藏解锁按钮区域
            unlockArea.classList.add('hidden');
            // 显示唱歌区域
            singerArea.classList.remove('hidden');

            // 重置内部状态（确保从干净状态开始）
            if (singInterval) clearInterval(singInterval);
            if (fireTimer) clearTimeout(fireTimer);
            if (smashTimer) clearTimeout(smashTimer);
            isBurning = false;
            isSmashing = false;
            singerBox.classList.remove('on-fire');
            smashZone.classList.add('hidden');
            smashZone.classList.remove('smashing');
            document.getElementById('singerEmoji').textContent = '🎤🧑‍🎤';

            // 开始唱歌
            startSinging();

            // 设定15秒后起火 (可根据需要调整)
            fireTimer = setTimeout(() => {
                igniteFire();
            }, 5000); // 5秒后起火，让演示更快看到效果；原需求是"最后直接起火了"，5秒合适。
            // 如果想更符合"无限唱歌最后起火"，可改成8000或10000，但演示用5000更佳
            // 注意：如果用户再次点击解锁会重置，已经做了清除

            // 额外，如果用户点击解锁时已经有计时器全部清除
        }

        // 购买按钮点击: 切换到页面3
        buyBtn.addEventListener('click', () => {
            // 先重置所有状态 (以防止从页面3返回时残留)
            resetAll();
            showPage('page3');
            // 确保解锁区域可见
            unlockArea.classList.remove('hidden');
            singerArea.classList.add('hidden');
            // 清除可能存在的计时器
            if (singInterval) clearInterval(singInterval);
            if (fireTimer) clearTimeout(fireTimer);
            if (smashTimer) clearTimeout(smashTimer);
            singInterval = null;
            fireTimer = null;
            smashTimer = null;
        });

        // 解锁按钮监听
        unlockBtn.addEventListener('click', onUnlock);

        // 为了让第一个页面自动进入第二个? 根据需求: 第一个是哭脸下面写着爸爸我要买这个，然后就切换到了乐子牌收音机的售卖卡片
        // 意思是自动切换? 应该是点击或自动? 描述"页面第一个就是...然后就切换到了..." 可以理解为自动展示一段时间后切换
        // 为了演示流畅，我们设定3秒后自动切换到售卖卡片（也可点击哭脸跳转，但无要求）
        // 但我们加一个自动切换，让演示连贯。同时也可以点击哭脸任意位置跳转（体验更好）
        // 注意：页面1的哭脸区域点击跳转到页面2，或者自动3s后跳转

        // 自动切换（3秒后）
        let autoSwitchTimer = setTimeout(() => {
            if (page1.classList.contains('active')) {
                showPage('page2');
            }
        }, 3000);

        // 点击哭脸也可以直接进入页面2 (不干扰自动)
        page1.addEventListener('click', (e) => {
            // 如果点击的是哭脸或文字，都进入页面2
            if (page1.classList.contains('active')) {
                // 清除自动切换计时器，避免重复
                if (autoSwitchTimer) clearTimeout(autoSwitchTimer);
                showPage('page2');
            }
        });

        // 但如果从页面2回到页面1? 不提供返回，只保持流程
        // 为了防止多次重置导致错误，再加一个全局点击清理（无必要）

        // 额外：在页面2点击购买后进入页面3，但可能用户想重新开始？不做返回，但可以刷新。
        // 当resetAll时，要清除autoSwitchTimer？我们不用清除，因为从页面1->2之后autoSwitchTimer不会影响page2显示
        // 如果resetAll后page1变活跃? 不可能，我们只在buy时resetAll，并显示page3
        // 但是resetAll中不清除autoSwitchTimer, 可能之后如果重新激活page1? 没有这种操作。
        // 稳妥起见，在buy点击时清除autoSwitchTimer
        // 修改buy监听:
        const originalBuyHandler = buyBtn.click;
        // 重新绑定buy监听，加入清除autoSwitchTimer
        buyBtn.addEventListener('click', () => {
            if (autoSwitchTimer) clearTimeout(autoSwitchTimer);
        });

        // 但是重复绑定，我们解绑之前简单监听？为了代码干净，使用新监听覆盖？不好，我们重构一下。
        // 直接在resetAll中清除autoSwitchTimer? 也许resetAll被调用时不需要清除，但保险。
        // 更好的方式: 将autoSwitchTimer也加入resetAll? 但是resetAll在buy中调用，如果清除autoSwitchTimer没问题。
        // 重新整理: 在buy事件中手动清除autoSwitchTimer。
        // 但刚才又加了一个监听, 会重复执行，导致多次clear，没事。
        // 使用一次性绑定，稍微整理:

<!-- 因为上面的脚本有变量声明顺序问题，我们重写一个干净整洁的脚本，替换掉之前的 -->
<script>
    (function() {
        // ----- 获取元素 -----
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const page3 = document.getElementById('page3');
        const buyBtn = document.getElementById('buyBtn');
        const unlockBtn = document.getElementById('unlockBtn');
        const unlockArea = document.getElementById('unlockArea');
        const singerArea = document.getElementById('singerArea');
        const singerBox = document.getElementById('singerBox');
        const songLyric = document.getElementById('songLyric');
        const smashZone = document.getElementById('smashZone');
        const singerEmoji = document.getElementById('singerEmoji');

        // ----- 状态变量 -----
        let singInterval = null;
        let fireTimer = null;
        let smashTimer = null;
        let autoSwitchTimer = null;      // 页面1自动切换到页面2
        let currentLyricIndex = 0;
        let isBurning = false;
        let isSmashing = false;

        // ----- 歌词 -----
        const lyrics = [
            "♪ 乐子牌收音机，无限唱不停 ♪",
            "♪ 爸爸我要买，买了就开心 ♪",
            "♪ 音质真不错，就是有点烫 ♪",
            "♪ 烧起来了！还唱！ ♪",
            "♪ 噢噢噢 起火啦 还在唱 ♪",
            "♪ 乐子公司 我谢谢你 ♪",
            "♪ 我现在就去砸你公司 ♪",
            "♪ 无限时长？无限火灾！ ♪",
        ];

        // ----- 工具函数：切换页面 -----
        function showPage(pageId) {
            page1.classList.remove('active');
            page2.classList.remove('active');
            page3.classList.remove('active');
            document.getElementById(pageId).classList.add('active');
        }

        // ----- 彻底重置 -----
        function resetAll() {
            // 清除所有计时器
            if (singInterval) clearInterval(singInterval);
            if (fireTimer) clearTimeout(fireTimer);
            if (smashTimer) clearTimeout(smashTimer);
            if (autoSwitchTimer) clearTimeout(autoSwitchTimer);
            singInterval = null;
            fireTimer = null;
            smashTimer = null;
            autoSwitchTimer = null;

            // 重置UI
            singerBox.classList.remove('on-fire');
            smashZone.classList.remove('smashing');
            smashZone.classList.add('hidden');
            singerArea.classList.add('hidden');
            unlockArea.classList.remove('hidden');
            songLyric.textContent = "♪ 啦啦啦 ♪";
            singerEmoji.textContent = '🎤🧑‍🎤';
            currentLyricIndex = 0;
            isBurning = false;
            isSmashing = false;
        }

        // ----- 开始唱歌（无限循环）-----
        function startSinging() {
            if (singInterval) clearInterval(singInterval);
            currentLyricIndex = 0;
            songLyric.textContent = lyrics[0];
            singInterval = setInterval(() => {
                currentLyricIndex = (currentLyricIndex + 1) % lyrics.length;
                songLyric.textContent = lyrics[currentLyricIndex];
            }, 1100);
        }

        // ----- 点火！-----
        function igniteFire() {
            if (isBurning) return;
            isBurning = true;
            singerBox.classList.add('on-fire');
            singerEmoji.textContent = '🔥🎤🔥';
            // 让歌词显示一条着火信息
            songLyric.textContent = "🔥 着火了！但还在唱！🔥";

            // 起火后1.2秒开始砸公司
            smashTimer = setTimeout(() => {
                if (!isSmashing) {
                    isSmashing = true;
                    smashZone.classList.remove('hidden');
                    smashZone.classList.add('smashing');
                }
            }, 1200);
        }

        // ----- 解锁按钮点击处理 -----
        function onUnlock() {
            // 隐藏解锁区域，展示唱歌区
            unlockArea.classList.add('hidden');
            singerArea.classList.remove('hidden');

            // 重置一切内部状态（保留页面，但清空旧的计时器）
            if (singInterval) clearInterval(singInterval);
            if (fireTimer) clearTimeout(fireTimer);
            if (smashTimer) clearTimeout(smashTimer);
            isBurning = false;
            isSmashing = false;
            singerBox.classList.remove('on-fire');
            smashZone.classList.add('hidden');
            smashZone.classList.remove('smashing');
            singerEmoji.textContent = '🎤🧑‍🎤';

            // 开始唱歌
            startSinging();

            // 设定5秒后起火（无限唱歌->起火）
            fireTimer = setTimeout(() => {
                igniteFire();
            }, 5000);
        }

        // ----- 购买按钮：进入页面3 -----
        buyBtn.addEventListener('click', () => {
            resetAll();                // 重置所有状态和计时器 (包括autoSwitchTimer)
            showPage('page3');
            // 确保解锁区可见，唱歌区隐藏（resetAll中已做）
        });

        // ----- 解锁按钮监听 -----
        unlockBtn.addEventListener('click', onUnlock);

        // ----- 页面1自动切换到页面2（3秒）-----
        function startAutoSwitch() {
            if (autoSwitchTimer) clearTimeout(autoSwitchTimer);
            autoSwitchTimer = setTimeout(() => {
                if (page1.classList.contains('active')) {
                    showPage('page2');
                }
            }, 3000);
        }

        // 页面1点击也切换到页面2
        page1.addEventListener('click', () => {
            if (page1.classList.contains('active')) {
                if (autoSwitchTimer) clearTimeout(autoSwitchTimer);
                showPage('page2');
            }
        });

        // 初始化：启动自动切换
        startAutoSwitch();

        // 如果用户刷新，页面1为active，一切正常。
        // 额外处理：在页面2点击购买时，由于resetAll会清除autoSwitchTimer，没问题。
        // 但是resetAll后，如果回到页面1? 不会，我们保持流程。
    })();
</script>
